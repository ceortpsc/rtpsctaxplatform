<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RTPSC signal monogram">
  <defs>
    <linearGradient id="chassis" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#064f6a"/>
      <stop offset="45%" stop-color="#0a7ea4"/>
      <stop offset="100%" stop-color="#4eb8d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#chassis)" stroke="url(#signal)" stroke-width="1.75"/>
  <rect x="7" y="7" width="50" height="50" rx="11" fill="none" stroke="#1a9bc7" stroke-width="0.75" opacity="0.4"/>
  <!-- Rising signal path -->
  <g fill="none" stroke="url(#signal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M16 44 L26 30 L34 38 L48 18"/>
  </g>
  <g fill="#4eb8d9">
    <circle cx="16" cy="44" r="2.8"/>
    <circle cx="26" cy="30" r="3.2"/>
    <circle cx="34" cy="38" r="2.6"/>
    <circle cx="48" cy="18" r="3.6"/>
  </g>
  <!-- Inner pulse on peak node -->
  <circle cx="48" cy="18" r="6" fill="none" stroke="#4eb8d9" stroke-width="1" opacity="0.45"/>
</svg>
