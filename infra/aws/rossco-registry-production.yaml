AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ROSS.CO Infinite Package Manager production registry: private S3 origin,
  CloudFront TLS delivery, Route 53 DNS, KMS signing key, and GitHub OIDC
  deployment role. Copyright 2026 Ross Tax Pro Software Co.

Parameters:
  RegistryDomainName:
    Type: String
    Default: registry.rosstaxprosoftware.com
    Description: Public registry FQDN controlled by Ross Tax Pro Software Co.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Public Route 53 hosted zone that contains RegistryDomainName.

  ExistingCertificateArn:
    Type: String
    Default: ''
    Description: >-
      Optional existing ACM certificate ARN in us-east-1. When supplied, the
      stack reuses this certificate instead of requesting a new one.

  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider.

  GitHubRepository:
    Type: String
    Default: ceortpsc/rtpsctaxplatform
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

  RegistryBucketName:
    Type: String
    Default: ''
    Description: Optional globally unique bucket name. Leave blank for generated name.

Conditions:
  HasExplicitBucketName: !Not [!Equals [!Ref RegistryBucketName, '']]
  HasExistingCertificate: !Not [!Equals [!Ref ExistingCertificateArn, '']]
  CreateManagedCertificate: !Equals [!Ref ExistingCertificateArn, '']

Resources:
  RegistrySigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: ROSS.CO Infinite production artifact signing key
      Enabled: true
      EnableKeyRotation: false
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      MultiRegion: false
      PendingWindowInDays: 30
      Tags:
        - Key: Product
          Value: ROSS.CO Infinite Package Manager
        - Key: Owner
          Value: Ross Tax Pro Software Co.

  RegistrySigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/rossco-infinite-production-signing
      TargetKeyId: !Ref RegistrySigningKey

  RegistryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasExplicitBucketName, !Ref RegistryBucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RetainNoncurrentReleases
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
      Tags:
        - Key: Product
          Value: ROSS.CO Infinite Package Manager
        - Key: DataClass
          Value: PublicReleaseArtifacts

  RegistryCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateManagedCertificate
    Properties:
      DomainName: !Ref RegistryDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref RegistryDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Product
          Value: ROSS.CO Infinite Package Manager

  RegistryOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Private S3 origin access for ROSS.CO registry
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RegistryDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref RegistryDomainName
        Comment: ROSS.CO Infinite Package Manager registry
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          TargetOriginId: RegistryS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        DefaultRootObject: site/index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: RegistryS3Origin
            DomainName: !GetAtt RegistryBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt RegistryOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !If
            - HasExistingCertificate
            - !Ref ExistingCertificateArn
            - !Ref RegistryCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Product
          Value: ROSS.CO Infinite Package Manager

  RegistryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RegistryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${RegistryBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RegistryDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt RegistryBucket.Arn
              - !Sub '${RegistryBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  RegistryAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RegistryDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt RegistryDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  RegistryAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RegistryDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RegistryDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  GitHubRegistryDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-deploy'
      Description: GitHub OIDC deployment role for the ROSS.CO registry
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepository}:ref:refs/tags/rossco-v*'
      Policies:
        - PolicyName: RossCoRegistryPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishRegistryArtifacts
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource:
                  - !GetAtt RegistryBucket.Arn
                  - !Sub '${RegistryBucket.Arn}/*'
              - Sid: InvalidateRegistryDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RegistryDistribution}'
              - Sid: SignAndVerifyRossArtifacts
                Effect: Allow
                Action:
                  - kms:GetPublicKey
                  - kms:Sign
                  - kms:Verify
                Resource: !GetAtt RegistrySigningKey.Arn
      Tags:
        - Key: Product
          Value: ROSS.CO Infinite Package Manager

Outputs:
  RegistryUrl:
    Description: Production ROSS.CO registry URL
    Value: !Sub 'https://${RegistryDomainName}'

  RegistryBucket:
    Description: Versioned artifact bucket
    Value: !Ref RegistryBucket

  RegistryDistributionId:
    Description: CloudFront distribution identifier
    Value: !Ref RegistryDistribution

  RegistryCertificateArn:
    Description: ACM certificate ARN used by CloudFront
    Value: !If
      - HasExistingCertificate
      - !Ref ExistingCertificateArn
      - !Ref RegistryCertificate

  RegistrySigningKeyArn:
    Description: KMS signing key ARN
    Value: !GetAtt RegistrySigningKey.Arn

  GitHubDeployRoleArn:
    Description: Configure this as repository variable AWS_ROLE_ARN
    Value: !GetAtt GitHubRegistryDeployRole.Arn
